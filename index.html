<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undertale - Шлях Рішучості</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scroll-wrapper">
        <section class="location-page intro">
            <div class="header">
                <h1 data-text="Що таке Андертейл"></h1>
                <p class="loc-desc" data-text="Легендарна історія про дитину, що впала у світ монстрів."></p>
            </div>

            <div class="story-center-block">
                <button class="reveal-btn">* ДІЗНАТИСЯ БІЛЬШЕ</button>
                <p class="story-text" data-text="Undertale — це рольова гра, де ваші дії мають наслідки. Ви опиняєтеся в Підземеллі — місці, куди людство вигнало монстрів після тривалої війни. Головна особливість гри в тому, що ви можете пройти її, не вбивши жодного ворога, використовуючи систему пощади, або ж стати справжнім тираном. Це історія про вибір, рішучість та силу дружби."></p>
            </div>
          
            <div class="content-grid">
                <div class="character-card left">
                    <h3 class="character-name">Dog</h3>
                    <div class="image-holder">
                        <img src="Dog.gif" alt="Dog">
                    </div>
                </div>
                <div class="character-card right">
                    <h3 class="character-name">Sans</h3>
                    <div class="image-holder">
                        <img src="Sans.gif" alt="Sans">
                    </div>
                </div>
            </div>
        </section>

        <section class="location-page ruins">
            <div class="header">
                <h1 data-text="Руїни"></h1>
                <p class="loc-desc" data-text="Стародавнє та забуте місце, де починається твоя подорож. Стіни тут пахнуть пилом та старими спогадами."></p>
            </div>

            <div class="story-center-block">
                <button class="reveal-btn">* ДОСЛІДИТИ ЛОКАЦІЮ</button>
                <p class="story-text" data-text="Ваша пригода починається з падіння на клумбу золотих квітів. Ви вчитеся розв'язувати пазли та розумієте, що навіть у найтемніших кутках Підземелля можна знайти милосердя. Тут ви зустрічаєте добру Торіель та тренувального манекена. Ви вчитеся поводитися з монстрами мирно, перш ніж покинути затишний дім Торіель."></p>
            </div>
            
            <div class="content-grid">
                <div class="character-card left">
                    <h3 class="character-name">Dummy</h3>
                    <div class="image-holder">
                        <img src="Dummy.jpg" alt="Dummy">
                    </div>
                </div>
                <div class="character-card right">
                    <h3 class="character-name">TorielCard</h3>
                    <div class="image-holder">
                        <img src="TorielCard.jpg" alt="TorielCard">
                    </div>
                </div>
            </div>
        </section>

        <section class="location-page snowdin">
            <div class="header">
                <h1 data-text="Сноудін"></h1>
                <p class="loc-desc" data-text="Засніжене містечко, де завжди панує холод, але серця монстрів зігрівають своєю теплотою та гумором."></p>
            </div>

            <div class="story-center-block">
                <button class="reveal-btn">* ДОСЛІДИТИ ЛОКАЦІЮ</button>
                <p class="story-text" data-text="Виходячи з Руїн, ви потрапляєте в морозний ліс, де вас зустрічає Санс — скелет-жартівник, та його амбітний брат Папірус. Вони розставили безліч пасток, щоб спіймати людину. Ви проходите крізь веселе містечко Сноудін і готуєтеся до вирішальної битви з Папірусом у великій сніговій бурі."></p>
            </div>
            
            <div class="content-grid">
                <div class="character-card left">
                    <h3 class="character-name">Papyrs</h3>
                    <div class="image-holder">
                        <img src="Papyrs.jpg" alt="Papyrs">
                    </div>
                </div>
                <div class="character-card right">
                    <h3 class="character-name">Sans</h3>
                    <div class="image-holder">
                        <img src="Sans.jpg" alt="Sans">
                    </div>
                </div>
            </div>
        </section>

        <section class="location-page waterfall">
            <div class="header">
                <h1 data-text="Водоспад"></h1>
                <p class="loc-desc" data-text="Місце спокою та шепоту ехо-квітів. Блакитне сяйво печер віддзеркалюється у чистих водах."></p>
            </div>

            <div class="story-center-block">
                <button class="reveal-btn">* ДОСЛІДИТИ ЛОКАЦІЮ</button>
                <p class="story-text" data-text="Це похмура, але прекрасна локація. За вами невпинно полює Андайн — лідерка королівської гвардії. Ви ховаєтеся в заростях високої трави, слухаєте шепіт ехо-квітів, що повторюють чужі розмови, та зустрічаєте сором'язливого привида Напстаблука."></p>
            </div>
            
            <div class="content-grid">
                <div class="character-card left">
                    <h3 class="character-name">Napstablook</h3>
                    <div class="image-holder">
                        <img src="Napstablook.jpg" alt="Napstablook">
                    </div>
                </div>
                <div class="character-card right">
                    <h3 class="character-name">MonsterKid</h3>
                    <div class="image-holder">
                        <img src="MonsterKid.jpg" alt="MonsterKid">
                    </div>
                </div>
            </div>
        </section>

        <section class="location-page hotland">
            <div class="header">
                <h1 data-text="Жаркокрай"></h1>
                <p class="loc-desc" data-text="Територія високих температур та передових технологій. Шлях перегороджують складні механізми."></p>
            </div>

            <div class="story-center-block">
                <button class="reveal-btn">* ДОСЛІДИТИ ЛОКАЦІЮ</button>
                <p class="story-text" data-text="Ви потрапляєте в технологічне серце Підземелля. Тут вас переслідує Андайн, але шлях також перегороджують елітні охоронці — Два Лицарі. Ви рухаєтеся крізь лавові озера та лазерні пастки, наближаючись до великої лабораторії."></p>
            </div>
            
            <div class="content-grid">
                <div class="character-card left">
                    <h3 class="character-name">Undyne</h3>
                    <div class="image-holder">
                        <img src="Undyne.jpg" alt="Undyne">
                    </div>
                </div>
                <div class="character-card right">
                    <h3 class="character-name">2Knights</h3>
                    <div class="image-holder">
                        <img src="2Knights.jpg" alt="2Knights">
                    </div>
                </div>
            </div>
        </section>

        <section class="location-page core">
            <div class="header">
                <h1 data-text="Ядро"></h1>
                <p class="loc-desc" data-text="Величезний технологічний комплекс, що забезпечує все Підземелля енергією. Механічне серце світу."></p>
            </div>

            <div class="story-center-block">
                <button class="reveal-btn">* ДОСЛІДИТИ ЛОКАЦІЮ</button>
                <p class="story-text" data-text="Це фінальне випробування. Ви б'єтеся з найсильнішими монстрами-найманцями, такими як Вімсалот та Фінал Фрогіт. В кінці на вас чекає грандіозна битва з Меттатоном EX, де ваша мета — підняти рейтинги шоу до максимуму."></p>
            </div>
            
            <div class="content-grid">
                <div class="character-card left">
                    <h3 class="character-name">Whimsalot</h3>
                    <div class="image-holder">
                        <img src="Whimsalot.jpg" alt="Whimsalot">
                    </div>
                </div>
                <div class="character-card right">
                    <h3 class="character-name">FinalFroggit</h3>
                    <div class="image-holder">
                        <img src="FinalFroggit.jpg" alt="FinalFroggit">
                    </div>
                </div>
            </div>
        </section>

        <section class="location-page new-home">
            <div class="header">
                <h1 data-text="Нова Домівка"></h1>
                <p class="loc-desc" data-text="Остання зупинка. Столиця королівства монстрів, застигла в сірих тонах меланхолії."></p>
            </div>

            <div class="story-center-block">
                <button class="reveal-btn">* ДОСЛІДИТИ ЛОКАЦІЮ</button>
                <p class="story-text" data-text="Це місто, де панує меланхолія. Тут вас знову зустрічає Флауї, нагадуючи про жорстокі правила Підземелля. Ви йдете через сірі коридори до тронної зали, де король Азгор чекає на вас, щоб прийняти доленосне рішення."></p>
            </div>
            
            <div class="content-grid">
                <div class="character-card left">
                    <h3 class="character-name">Flowey</h3>
                    <div class="image-holder">
                        <img src="Flowey.jpg" alt="Flowey">
                    </div>
                </div>
                <div class="character-card right">
                    <h3 class="character-name">Asgore</h3>
                    <div class="image-holder">
                        <img src="Asgore.jpg" alt="Asgore">
                    </div>
                </div>
            </div>
        </section>

        <section class="location-page true-lab">
            <div class="header">
                <h1 data-text="Справжня Лабораторія"></h1>
                <p class="loc-desc" data-text="Приховане місце глибоко під землею, де зберігаються найтемніші таємниці експериментів."></p>
            </div>

            <div class="story-center-block">
                <button class="reveal-btn">* ДОСЛІДИТИ ЛОКАЦІЮ</button>
                <p class="story-text" data-text="Тут ви зустрічаєте Альфіс, яка нарешті наважується показати вам свої секрети. У холодних коридорах ви бачите результати експериментів з Рішучістю — Амальгамів. Це місце відкриває правду про створення Флауї та минуле Підземелля."></p>
            </div>
            
            <div class="content-grid">
                <div class="character-card left">
                    <h3 class="character-name">Alphys</h3>
                    <div class="image-holder">
                        <img src="Alphys.jpg" alt="Alphys">
                    </div>
                </div>
               
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            function typeWriter(element, text, speed, callback) {
                element.innerHTML = '';
                element.style.display = 'block';
                let i = 0;
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else if (callback) {
                        callback();
                    }
                }
                type();
            }

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const h1 = entry.target.querySelector('h1');
                        const desc = entry.target.querySelector('.loc-desc');

                        if (h1 && !h1.classList.contains('typed')) {
                            const h1Text = h1.getAttribute('data-text');
                            typeWriter(h1, h1Text, 40);
                            h1.classList.add('typed');
                        }

                        if (desc && !desc.classList.contains('typed')) {
                            const descText = desc.getAttribute('data-text');
                            setTimeout(() => { typeWriter(desc, descText, 15); }, 500); 
                            desc.classList.add('typed');
                        }
                    }
                });
            }, { threshold: 0.2 });

            document.querySelectorAll('.location-page').forEach(page => {
                observer.observe(page);
            });

            document.querySelectorAll('.story-center-block').forEach(block => {
                const btn = block.querySelector('.reveal-btn');
                const textEl = block.querySelector('.story-text');
                const fullText = textEl.getAttribute('data-text');
                
                textEl.style.display = 'none';

                btn.addEventListener('click', () => {
                    btn.style.display = 'none';
                    block.classList.add('expanded');
                    typeWriter(textEl, fullText, 15);
                });
            });
        });
    </script>
</body>
</html>
